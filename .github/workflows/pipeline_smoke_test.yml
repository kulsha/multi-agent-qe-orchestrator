name: QA Pipeline Smoke Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Agent 1 smoke test
        run: |
          python agents/story_intake_agent.py --story US_001_login_poc.md
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Verify Agent 1 output
        run: |
          test -f outputs/US_001_poc_structured.json && \
          echo "✅ Agent 1 output verified" || \
          (echo "❌ Agent 1 output missing" && exit 1)

      - name: Upload pipeline outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-outputs
          path: |
            outputs/
            docs/
          retention-days: 7